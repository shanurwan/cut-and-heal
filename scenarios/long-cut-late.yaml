# One arm of the question in docs/METHOD.md section 12. Identical to long-cut except that
# the shutdown begins 150 s later, so it falls at a different point of every node's age.
name: long-cut-late
title: A fifteen-minute shutdown with default TCP timers, begun 150 s later

regions:
  ir:
    nodes: 50
    domestic: {delay_ms: 20, jitter_ms: 4, rate_mbit: 50}
  world:
    nodes: 100
    domestic: {delay_ms: 50, jitter_ms: 10, rate_mbit: 50}

borders:
  ir-world:
    between: [ir, world]
    gated: ir
    healthy: {delay_ms: 100, jitter_ms: 20, loss_pct: 0.5, rate_mbit: 20}

bootstrap_region: world

publish:
  rate_hz: 1
  size_bytes: 1000

timeline:
  - {name: baseline, duration_s: 390}
  - {name: shut, duration_s: 900, borders: {ir-world: {open_nodes: 0}}}
  - {name: restored, duration_s: 300}
