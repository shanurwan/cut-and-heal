# The question in docs/METHOD.md section 17: does a Kubernetes NetworkPolicy, applied while
# a mesh is running, partition it? The regions and links of long-cut; the border is shut by
# the controller with one policy per side, as a partition test in a lab often is.
name: policy-cut
title: A ten-minute shutdown made with NetworkPolicies

regions:
  ir:
    nodes: 50
    domestic: {delay_ms: 20, jitter_ms: 4, rate_mbit: 50}
  world:
    nodes: 100
    domestic: {delay_ms: 50, jitter_ms: 10, rate_mbit: 50}

borders:
  ir-world:
    between: [ir, world]
    gated: ir
    healthy: {delay_ms: 100, jitter_ms: 20, loss_pct: 0.5, rate_mbit: 20}

bootstrap_region: world

publish:
  rate_hz: 1
  size_bytes: 1000

cut: networkpolicy

timeline:
  - {name: baseline, duration_s: 240}
  - {name: shut, duration_s: 600, borders: {ir-world: {open_nodes: 0}}}
  - {name: restored, duration_s: 300}
