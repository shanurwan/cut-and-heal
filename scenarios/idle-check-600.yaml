# One arm of the question in docs/METHOD.md section 13. The regions, links and cut of
# long-cut, with the shutdown held for eighteen minutes, on a node built from the
# regression node's source with its yamux idle timeout set to 600 s instead of the default 300 s.
name: idle-check-600
title: An eighteen-minute shutdown with a yamux idle timeout of 600 s

regions:
  ir:
    nodes: 50
    domestic: {delay_ms: 20, jitter_ms: 4, rate_mbit: 50}
  world:
    nodes: 100
    domestic: {delay_ms: 50, jitter_ms: 10, rate_mbit: 50}

borders:
  ir-world:
    between: [ir, world]
    gated: ir
    healthy: {delay_ms: 100, jitter_ms: 20, loss_pct: 0.5, rate_mbit: 20}

bootstrap_region: world

node:
  image: cut-and-heal-node:yamux-idle
  env: {YAMUX_IDLE_TIMEOUT_S: "600"}

publish:
  rate_hz: 1
  size_bytes: 1000

timeline:
  - {name: baseline, duration_s: 240}
  - {name: shut, duration_s: 1080, borders: {ir-world: {open_nodes: 0}}}
  - {name: restored, duration_s: 300}
